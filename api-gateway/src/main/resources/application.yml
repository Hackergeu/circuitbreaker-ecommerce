server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service-route
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/products/**
            - id: inventory-service-route
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**
            - id: recommendation-service-route
              uri: lb://RECOMMENDATION-SERVICE
              predicates:
                - Path=/recommendations/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: recommendationCircuitBreaker
                    fallbackUri: forward:/fallback/recommendations

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      recommendationCircuitBreaker:
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      recommendationCircuitBreaker:
        timeout-duration: 2s
  bulkhead:
    instances:
      recommendationCircuitBreaker:
        max-concurrent-calls: 5
        max-wait-duration: 2s

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans